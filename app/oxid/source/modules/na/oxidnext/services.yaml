services:
    _defaults:
        public: false
        autowire: true

    NetAdvising\OxidNext\GraphQL\:
        resource: 'GraphQL/*'
        exclude: 'GraphQL/**/{DataType,Exception,Shop,Event,Subscriber}'
        public: true

    NetAdvising\OxidNext\GraphQL\Shared\Service\NamespaceMapper:
        class: NetAdvising\OxidNext\GraphQL\Shared\Service\NamespaceMapper
        tags: ['graphql_namespace_mapper']

    NetAdvising\OxidNext\GraphQL\Shared\Service\PermissionProvider:
        class: NetAdvising\OxidNext\GraphQL\Shared\Service\PermissionProvider
        tags: ['graphql_permission_provider']

